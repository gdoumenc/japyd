[project]
name = "japyd"
version = "1.1.23"
description = "JSON:API server toolkit for Flask and Pydantic: automatic relationships, JsonApiDotNetCore filter syntax, pagination and errors."
authors = [
    { name = "gdoumenc", email = "gdoumenc@neorezo.io" },
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
keywords = [
    "jsonapi",
    "json-api",
    "json:api",
    "pydantic",
    "flask",
    "rest",
    "api",
    "serialization",
    "filtering",
    "jsonapidotnetcore",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: Flask",
    "Framework :: Pydantic :: 2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "flask",
    "flask-pydantic>=0.13.1",
    "requests",
]

[project.urls]
Homepage = "https://github.com/gdoumenc/japyd"
Documentation = "https://github.com/gdoumenc/japyd#readme"
Repository = "https://github.com/gdoumenc/japyd"
Issues = "https://github.com/gdoumenc/japyd/issues"

[project.optional-dependencies]
dev = [
    "twine",
    "pytest>=8.4.1",
    "mypy>=1.17.1",
    "ruff>=0.12.7",
    "cloudsmith-cli>=1.8.3",
    "codecov>=2.1.13",
    "pytest-cov>=6.2.1",
    "pip>=25.2",
    "types-requests>=2.31.0.6",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
excludes = ["tests/"]

[tool.pdm.scripts]
ruff = { cmd = "ruff check src", help = "Linting using Ruff" }
mypy = { cmd = "mypy src --exclude neorezo/biz", help = "Type checking using mypy" }
pytest = { cmd = "pytest .", help = "Unit testing using pytest" }
tests.composite = ["ruff", "mypy", "pytest"]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = "tests"
markers = [
    "wip",
]

[[tool.mypy.overrides]]
module = ["jsonapi_pydantic.*"]
follow_untyped_imports = true

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.isort]
force-sort-within-sections = true
split-on-trailing-comma = true
